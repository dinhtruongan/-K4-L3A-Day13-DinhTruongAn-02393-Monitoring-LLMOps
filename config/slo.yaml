service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Request-based SLO over a rolling 28-day window: at least 99.5% of received
    requests must return successfully within 3 seconds. A 0.5% error budget
    permits 5 bad requests per 1,000 requests. The 3-second threshold leaves
    headroom over the observed 2.512-second baseline P95 while the rag_slow
    practice incident crosses the threshold.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
